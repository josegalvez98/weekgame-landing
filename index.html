<style>
/* WeekGame, landing de la lista de espera. Misma identidad que el tema Anime del prototipo:
   negro violeta, títulos Bangers, paneles de papel con borde de tinta y sombra dura violeta. */
:root{
  --bg:#120A1E; --bg-2:#1A1029; --deep:#0A0512;
  --paper:#F6F4EE; --paper-2:#EFECE4; --ink:#15161C;
  --vd:#7A3BFF; --vd-lit:#AB8BFF; --br:#D3242B;
  --txt:#F4F4FA; --txt-2:#C9CBE0; --txt-3:#8E92B8;
  --p-txt:#15161C; --p-txt-2:#33354A; --p-txt-3:#5F6280;
  --disp:'Bangers',Impact,'Arial Narrow',sans-serif;
  --sans:'Zen Kaku Gothic New','Noto Sans JP','Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:17px;line-height:1.6;
  background-image:repeating-linear-gradient(115deg,transparent 0 46px,rgba(122,59,255,.07) 46px 48px);}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:1px;line-height:1.02;margin:0;color:#fff;
  text-shadow:3px 3px 0 var(--deep)}
h1{font-size:clamp(44px,9vw,84px)}
h2{font-size:clamp(34px,6vw,54px)}
h3{font-size:24px;letter-spacing:.5px;text-shadow:none}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:56px 0}
@media(min-width:760px){section{padding:88px 0}}

/* Cabecera */
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font-family:var(--disp);font-size:26px;letter-spacing:2px;text-decoration:none;text-shadow:2px 2px 0 var(--deep)}
.brand b{font-weight:400;color:var(--vd-lit)}
.lang{display:flex;border:2px solid #fff;background:var(--ink);transform:skewX(-6deg)}
.lang button{font:600 14px/1 var(--sans);padding:9px 12px;border:0;background:none;color:#fff;cursor:pointer;transform:skewX(6deg)}
.lang button.on{background:var(--vd)}
.lang button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--vd-lit);outline-offset:3px}

/* Botones: los de la app, con la inclinación de viñeta */
.btn{display:inline-block;font:400 20px/1 var(--disp);letter-spacing:1.5px;padding:15px 22px;border:2px solid #fff;
  background:var(--ink);color:#fff;text-decoration:none;box-shadow:4px 4px 0 var(--vd);transform:skewX(-6deg);cursor:pointer}
.btn>span{display:inline-block;transform:skewX(6deg)}
.btn.vd{background:var(--vd);box-shadow:4px 4px 0 #fff}
.btn:active{transform:skewX(-6deg) translate(2px,2px);box-shadow:2px 2px 0 var(--vd)}
.btn.vd:active{box-shadow:2px 2px 0 #fff}

/* Paneles de papel */
.panel{background:var(--paper);color:var(--p-txt);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--vd);padding:22px}
.panel h3{color:var(--p-txt)}
.panel p{color:var(--p-txt-2)}

/* Móvil con la captura */
.phone{border:3px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--deep);box-shadow:8px 8px 0 var(--vd)}
.phone img{width:100%}

/* Portada */
.hero{padding-top:28px}
.hero .grid{display:grid;gap:36px;align-items:center}
@media(min-width:760px){.hero .grid{grid-template-columns:1.15fr .85fr;gap:56px}.hero{padding-top:48px}}
.kicker{display:inline-block;font:700 14px/1 var(--sans);color:var(--ink);background:var(--vd-lit);padding:7px 10px;margin-bottom:18px;transform:skewX(-6deg)}
.kicker span{display:inline-block;transform:skewX(6deg)}
.lead{font-size:19px;color:var(--txt-2);max-width:34em;margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:16px 20px;margin-top:28px}
.hero .phone{max-width:340px;margin:0 auto}

/* Personaje: los seis retratos, en fila */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
@media(min-width:760px){.tiers{grid-template-columns:repeat(6,1fr)}}
.tier{text-align:center}
.tier .pic{aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,rgba(122,59,255,.28),transparent 68%)}
.tier img{width:88%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.tier b{display:block;font:400 20px/1.1 var(--disp);letter-spacing:1px;margin-top:8px}
.tier small{display:block;font-size:13px;color:var(--txt-3)}

/* Cómo funciona: tres pasos en orden, cada uno con su pantalla */
.steps{display:grid;gap:28px;margin-top:32px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr);gap:24px}}
.step .phone{max-width:280px;margin:0 auto 18px}
.step .n{font:400 44px/1 var(--disp);color:var(--vd-lit);text-shadow:3px 3px 0 var(--deep)}
.step h3{margin-top:6px}
.step p{margin-top:8px;color:var(--txt-2)}

/* Temas */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}
@media(min-width:760px){.themes{gap:24px}}
.theme .phone{border-width:2px;border-radius:18px;box-shadow:4px 4px 0 var(--vd)}
.theme b{display:block;font:400 22px/1.1 var(--disp);letter-spacing:1px;margin-top:12px;text-align:center}
.themes-note{margin-top:20px;color:var(--txt-3);font-size:15px;text-align:center}

/* Cuatro cosas decididas */
.facts{display:grid;gap:16px;margin-top:32px}
@media(min-width:760px){.facts{grid-template-columns:1fr 1fr;gap:22px}}
.facts .panel p{margin-top:6px}

/* Beta: el formulario */
.beta .panel{max-width:560px;padding:28px 24px}
@media(min-width:760px){.beta .panel{padding:36px}}
.beta h2{color:#fff}
.beta .panel p.sub{margin-top:8px}
form{margin-top:22px}
label{display:block;font-weight:700;font-size:15px;color:var(--p-txt)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
input[type=email]{flex:1 1 220px;min-width:0;font:400 17px/1 var(--sans);padding:14px;border:2px solid var(--ink);background:#fff;color:var(--p-txt);border-radius:0}
input[type=email]::placeholder{color:#8F92AD}
.note{font-size:14px;color:var(--p-txt-3);margin-top:12px}
.msg{margin-top:12px;font-weight:700;display:none}
.msg.ok{display:block;color:#3C1E8F}
.msg.bad{display:block;color:var(--br)}
.gotcha{position:absolute;left:-9999px}

footer{padding:36px 0 48px;font-size:14px;color:var(--txt-3)}
footer p+p{margin-top:8px}
footer a{color:var(--txt-2)}

@media(prefers-reduced-motion:no-preference){
  .lang button,.btn{transition:transform .08s,box-shadow .08s}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <a class="brand" href="./">Week<b>Game</b></a>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">Español</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>
</div>

<!-- Portada -->
<section class="hero"><div class="wrap grid">
  <div>
    <p class="kicker"><span data-t="kicker"></span></p>

    <p class="lead" data-t="lead"></p>
    <div class="cta">
      <a class="btn vd" href="prototipo/"><span data-t="try"></span></a>
      <a class="btn" href="#beta"><span data-t="join"></span></a>
    </div>
  </div>
  <div class="phone"><img src="capturas/semana.png" width="780" height="1688" alt="" data-alt="altSemana"></div>
</div></section>

<!-- Personaje -->
<section><div class="wrap">
  <h2 data-t="tierT"></h2>
  <p class="lead" data-t="tierP"></p>
  <div class="tiers" id="tiers"></div>
</div></section>

<!-- Cómo funciona -->
<section><div class="wrap">
  <h2 data-t="howT"></h2>
  <div class="steps">
    <div class="step">
      <div class="phone"><img src="capturas/entrada.png" width="780" height="1688" alt="" data-alt="altEntrada" loading="lazy"></div>
      <p class="n">1</p><h3 data-t="s1t"></h3><p data-t="s1p"></p>
    </div>
    <div class="step">
      <div class="phone"><img src="capturas/cierre.png" width="780" height="1688" alt="" data-alt="altCierre" loading="lazy"></div>
      <p class="n">2</p><h3 data-t="s2t"></h3><p data-t="s2p"></p>
    </div>
    <div class="step">
      <div class="phone"><img src="capturas/nivel.png" width="780" height="1688" alt="" data-alt="altNivel" loading="lazy"></div>
      <p class="n">3</p><h3 data-t="s3t"></h3><p data-t="s3p"></p>
    </div>
  </div>
</div></section>

<!-- Temas -->
<section><div class="wrap">
  <h2 data-t="themeT"></h2>
  <p class="lead" data-t="themeP"></p>
  <div class="themes">
    <div class="theme"><div class="phone"><img src="capturas/semana.png" width="780" height="1688" alt="" data-alt="altAnime" loading="lazy"></div><b>Anime</b></div>
    <div class="theme"><div class="phone"><img src="capturas/tema-ceniza.png" width="780" height="1688" alt="" data-alt="altCeniza" loading="lazy"></div><b data-t="ceniza"></b></div>
    <div class="theme"><div class="phone"><img src="capturas/tema-gym.png" width="780" height="1688" alt="" data-alt="altGym" loading="lazy"></div><b data-t="gym"></b></div>
  </div>
  <p class="themes-note" data-t="themeN"></p>
</div></section>

<!-- Decidido -->
<section><div class="wrap">
  <h2 data-t="factsT"></h2>
  <div class="facts">
    <div class="panel"><h3 data-t="f1t"></h3><p data-t="f1p"></p></div>
    <div class="panel"><h3 data-t="f2t"></h3><p data-t="f2p"></p></div>
    <div class="panel"><h3 data-t="f3t"></h3><p data-t="f3p"></p></div>
    <div class="panel"><h3 data-t="f4t"></h3><p data-t="f4p"></p></div>
  </div>
</div></section>

<!-- Preguntas -->
<section><div class="wrap">
  <h2 data-t="faqT"></h2>
  <div class="facts" id="faq"></div>
</div></section>

<!-- Beta -->
<section class="beta" id="beta"><div class="wrap">
  <h2 data-t="betaT"></h2>
  <div class="panel" style="margin-top:24px">
    <p class="sub" data-t="betaP"></p>
    <form class="wait" id="f1" action="https://formspree.io/f/xdeknkzd" method="POST">
      <label for="email1" data-t="label"></label>
      <div class="row">
        <input type="email" id="email1" name="email" required autocomplete="email" data-ph="ph">
        <button class="btn vd" type="submit"><span data-t="btn"></span></button>
      </div>
      <input type="hidden" name="lang" value="es">
      <input type="hidden" name="de" value="">
      <input type="hidden" name="_subject" value="WeekGame: nuevo apuntado">
      <label class="gotcha" aria-hidden="true">No rellenar <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
      <p class="note" data-t="note"></p>
      <p class="msg" role="status"></p>
    </form>
  </div>
</div></section>

<footer><div class="wrap">
  <p data-t="foot1"></p>
  <p data-t="foot2"></p>
</div></footer>

// --- Idioma: ?lang=, luego el guardado, luego el del navegador ---
let lang = 'es';
try {
  const q = new URLSearchParams(location.search).get('lang');
  const guardado = localStorage.getItem('wg-lang');
  lang = q || guardado || ((navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en');
} catch { lang = 'es'; }
if (!T[lang]) lang = 'es';

function aplicar(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = t[el.dataset.ph]; });
  document.querySelectorAll('[data-alt]').forEach((el) => { el.alt = t[el.dataset.alt]; });
  document.querySelectorAll('input[name=lang]').forEach((el) => { el.value = l; });
  document.querySelectorAll('input[name=_subject]').forEach((el) => { el.value = t.sub; });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === l));
  document.getElementById('tiers').innerHTML = t.tiers.map((x, i) =>
    `<div class="tier"><div class="pic"><img src="prototipo/img/an-${i}.png" width="320" height="320" alt="" loading="lazy"></div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
  document.getElementById('faq').innerHTML = t.faq.map((q) => `<div class="panel"><h3>${q[0]}</h3><p>${q[1]}</p></div>`).join('');
  const url = new URL(location.href); url.searchParams.set('lang', l); history.replaceState(null, '', url);
  try { localStorage.setItem('wg-lang', l); } catch {}
}
document.querySelector('.lang').addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]'); if (b) aplicar(b.dataset.lang);
});
aplicar(lang);

// --- Canal de origen: ?de=ig, ?de=tiktok, ?de=reddit, ?de=amigos… llega con cada correo de Formspree ---
try {
  const de = (new URLSearchParams(location.search).get('de') || '').slice(0, 40);
  document.querySelectorAll('input[name=de]').forEach((el) => { el.value = de; });
} catch {}

// --- Envío a Formspree sin salir de la página; si falla el JS, el formulario envía normal ---
document.querySelectorAll('form.wait').forEach((f) => {
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = f.querySelector('button'), msg = f.querySelector('.msg');
    btn.disabled = true; msg.className = 'msg';
    try {
      const r = await fetch(f.action, { method: 'POST', body: new FormData(f), headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error(r.status);
      msg.textContent = T[lang].ok; msg.className = 'msg ok';
      f.querySelector('.row').hidden = true; f.querySelector('.note').hidden = true;
    } catch {
      msg.textContent = T[lang].bad; msg.className = 'msg bad'; btn.disabled = false;
    }
  });
});
</script>
