<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeekGame">
<meta name="theme-color" content="#120A1E">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/icono.png">
</head>
<body>
<title>WeekGame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Grenze+Gotisch:wght@500;600;700&family=Bangers&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* WeekGame · prototipo clicable con datos de ejemplo (v6, 17/09/2026: WeekGame, cinco temas con retratos).
   Temas: Minimalista (clave cobalto; claro, por defecto), Ceniza, Anime, Gimnasio y 8 bits (17/09/2026: fuera
   las paletas Olivo, Basalto, Mármol y Verdigrís). En todos, el primer color (--vd) es progreso y el
   segundo (--br) es rango. Los componentes solo usan tokens.
   Ceniza es un tema temático (fantasía sombría, sin ambientación de obras existentes): títulos y
   emblema propios (TITULOS_CENIZA/TRAMOS_CENIZA, emblemaCeniza), fondo con ascuas animadas (.embers).
   Pantalla Semana en disposición "Fusión": anillo de experiencia, misión, bloques como chips
   y el elegido desplegado; al abrir la app sale la pantalla de entrada "¿Qué has hecho hoy?". */
:root{
  --bg:#E6E3DB; --bg-2:#ECEAE3; --sur:#F3F1EC; --sur-2:#FAF9F6; --deep:#DDD9CF;
  --line:#CBC7BB; --line-2:#B7B2A4;
  --vd:#2E7F6C; --vd-lit:#25705E; --vd-dim:#BFDCD3; --vd-ghost:rgba(46,127,108,.12);
  --br:#9A6530; --br-lit:#7E501F; --br-dim:#DCC7AE; --br-ghost:rgba(154,101,48,.12);
  --txt:#1E221F; --txt-2:#3E443F; --txt-3:#6B716B; --txt-4:#8F948D;
  --bad:#A8473B; --bad-dim:#EED3CE; --bad-lit:#8E3A30;
  --on-vd:#F4FBF8; --shield:#F6F4EF; --out:#CFCBC1;
  --bronce:#9A6530; --plata:#7E8480; --oro:#B08A2E; --platino:#5F6E6C; --diamante:#2E7F9A; --leyenda:#6C4FB0;
  --cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  --cut-lg:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  --disp:Marcellus,'Trajan Pro',Georgia,serif;
  --sans:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  --tabs:64px;
  color-scheme:light;
}
:root[data-theme="cobalto"]{
  --bg:#F2F2EF; --bg-2:#F6F6F3; --sur:#FBFBF9; --sur-2:#FFFFFF; --deep:#E6E6E1;
  --line:#D3D3CC; --line-2:#BDBDB4;
  --vd:#2C55C9; --vd-lit:#2447AD; --vd-dim:#C5D0F0; --vd-ghost:rgba(44,85,201,.11);
  --br:#4A4E56; --br-lit:#33363D; --br-dim:#D0D2D6; --br-ghost:rgba(74,78,86,.1);
  --txt:#1B1D21; --txt-2:#3C3F45; --txt-3:#6A6E75; --txt-4:#8F939A;
  --bad:#B4463A; --bad-dim:#F0D4CF; --bad-lit:#953629;
  --on-vd:#F4F7FF; --shield:#FFFFFF; --out:#E2E2DD;
  --bronce:#9A6530; --plata:#7E8480; --oro:#B08A2E; --platino:#5F6E6C; --diamante:#2E7F9A; --leyenda:#6C4FB0;
  color-scheme:light;
}
:root[data-theme="ceniza"]{
  --bg:#0B0705; --bg-2:#100B07; --sur:#3A3835; --sur-2:#47443F; --deep:#232120;
  --line:#57534E; --line-2:#7A746B;
  --vd:#C9502D; --vd-lit:#F08A4E; --vd-dim:#5B2A15; --vd-ghost:rgba(201,80,45,.16);
  --br:#9C7B44; --br-lit:#D9AA5C; --br-dim:#372B16; --br-ghost:rgba(201,150,74,.14);
  --txt:#EFE3CA; --txt-2:#D6C8A9; --txt-3:#B3A384; --txt-4:#7F7259;
  --bad:#8A3324; --bad-dim:#3A1712; --bad-lit:#C86048;
  --on-vd:#180B04; --shield:#4A4230; --out:#020202;
  --bronce:#8B6A3F; --plata:#9C9689; --oro:#D9A93E; --platino:#8C9490; --diamante:#5E8FA0; --leyenda:#8E6FB0;
  --disp:Cinzel,'Trajan Pro',Georgia,serif;
  --disp-w:700;
  --disp-sub:'Cormorant Garamond',Georgia,serif;
  --disp-med:'Grenze Gotisch','Cinzel',Georgia,serif;
  --sans:Spectral,var(--sans-base,'Iowan Old Style'),Georgia,serif;
  --cut:none; --cut-lg:none;
  /* Cajas de ceniza: bordes rectos; alguna esquina carcomida con máscara (img/losa-*.png, ver más abajo) */
  --stone-clip:none;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* El envoltorio del artefacto de Claude pone en :root un padding con los márgenes seguros del iPhone (notch y barra
   inferior); aquí ya los tienen en cuenta la cabecera y las pestañas, así que sin esto salen dobles: hueco arriba
   y banda del color de fuera al final del scroll. */
:root{padding:0 !important}
html{background:var(--out)}
body{margin:0;background:var(--out);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;font-size:inherit}
input,select{font-family:inherit}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.num{font-variant-numeric:tabular-nums}
:is(button,input,select,[tabindex]):focus-visible{outline:2px solid var(--vd);outline-offset:2px}

.phone{position:relative;max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:520px){.phone{min-height:100vh;box-shadow:0 0 0 1px var(--line),0 0 90px rgba(0,0,0,.35)}}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 10px;background:linear-gradient(var(--bg) 78%,transparent)}
.top .brand{font-family:var(--disp);font-size:19px;letter-spacing:.5px;color:var(--txt);line-height:1}
.top .brand b{color:var(--vd);font-weight:400}
.top .week{text-align:right;font-family:var(--disp);font-size:14px;color:var(--txt-2);line-height:1.2}
.top .week small{display:block;font-family:var(--sans);font-size:13px;color:var(--txt-3)}

main{flex:1;padding:6px 16px calc(var(--tabs) + 30px + env(safe-area-inset-bottom))}
.screen{display:none;flex-direction:column;gap:26px}
.screen.on{display:flex}

.h{font-family:var(--disp);font-size:15px;color:var(--txt-2);margin:0;display:flex;align-items:center;gap:12px}
.h::after{content:'';flex:1;height:1px;background:var(--line)}
.h .r{font-family:var(--sans);font-size:13px;color:var(--txt-3);order:2}
.h .r button{color:var(--txt-3);text-decoration:underline;text-underline-offset:2px;font-size:13px}
.hint{font-size:13.5px;color:var(--txt-3);margin:0;line-height:1.4}
.esc{display:inline-block;font-family:var(--disp);font-size:12px;color:var(--br);border:1px solid var(--br-dim);padding:0 6px;line-height:1.6;white-space:nowrap}
.tag{display:inline-block;font-size:12px;color:var(--txt-3);border:1px solid var(--line);padding:0 6px;line-height:1.6;white-space:nowrap}
.btn{display:block;width:100%;background:var(--vd);color:var(--on-vd);font-family:var(--disp);font-size:16px;padding:15px;text-align:center;clip-path:var(--cut);transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn-2{display:block;width:100%;background:var(--sur);border:1px solid var(--line-2);color:var(--txt-2);padding:13px;font-size:15px;text-align:center;clip-path:var(--cut)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:14px;height:6px;background:var(--deep);border:1px solid var(--line-2)}
.meter i.on{background:var(--vd);border-color:var(--vd)}
.meter i.half{background:linear-gradient(90deg,var(--vd) 50%,var(--deep) 50%);border-color:var(--vd)}
.orn{display:flex;align-items:center;gap:10px;margin:0}
.orn>span{height:1px;flex:1;background:var(--line)}
.orn i{width:6px;height:6px;transform:rotate(45deg);background:var(--vd)}
.card{background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.list{display:flex;flex-direction:column;gap:8px}
.cat{display:flex;flex-direction:column;gap:8px}
.chev{font-family:var(--disp);color:var(--br);font-size:20px}

/* Barra de experiencia (Personaje) */
.xp{position:relative;height:14px;background:var(--deep);border:1px solid var(--line-2);padding:2px;margin:12px 0 0}
.xp>i{display:block;height:100%;background:var(--vd);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xp .notch{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(10,1fr);pointer-events:none}
.xp .notch span{border-right:1px solid var(--deep)}
.xp .notch span:last-child{border:none}
.xp-txt{display:flex;justify-content:space-between;margin-top:6px;font-size:13.5px;color:var(--txt-3)}
.xp-txt b{font-weight:500;color:var(--txt-2)}
.xp-delta{margin-left:8px;color:var(--vd-lit);opacity:0;transition:opacity .3s;font-weight:500}
.xp-delta.on{opacity:1}

/* Tira de días (dentro del bloque Pasos) */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut);color:var(--txt-3);transition:background .15s}
.strip .d{font-family:var(--disp);font-size:14px}
.strip .k{font-size:12.5px;min-height:15px;color:var(--txt-2)}
.strip .dot{width:7px;height:7px;transform:rotate(45deg);background:var(--deep);border:1px solid var(--line-2)}
.strip button.act .dot{background:var(--vd);border-color:var(--vd)}
.strip button.act{color:var(--txt-2)}
.strip button.today{border-color:var(--vd);background:var(--vd-ghost);color:var(--txt)}
.strip button.future{opacity:.55}
.strip-foot{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--txt-3);margin-top:8px;flex-wrap:wrap}
.strip-foot b{font-weight:500;color:var(--txt-2)}

/* Misión */
.check{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font-size:16px;line-height:1.35}
.box{flex:none;width:22px;height:22px;margin-top:1px;border:1px solid var(--line-2);background:var(--sur-2);display:grid;place-items:center;font-size:14px;color:var(--on-vd);transition:background .15s}
.check.on .box{background:var(--vd);border-color:var(--vd)}
.check.on .box::after{content:'✓'}
/* Ceniza: el check es un frasco de vida (imágenes generadas, img/frasco-*.png con transparencia real
   sacada por img/alfa.py). Vacío debajo; el lleno se funde encima al marcar, con un destello. */
:root[data-theme="ceniza"] .box{width:40px;height:40px;margin:-8px 0 -6px;border:none;background:url(img/frasco-vacio.png) center/contain no-repeat;position:relative;transition:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
:root[data-theme="ceniza"] .box::after{content:'';position:absolute;inset:0;background:url(img/frasco-lleno.png) center/contain no-repeat;opacity:0;transform:scale(.92);transition:opacity .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
:root[data-theme="ceniza"] .check.on .box{background:url(img/frasco-vacio.png) center/contain no-repeat;border:none;filter:drop-shadow(0 0 6px rgba(240,138,78,.55))}
:root[data-theme="ceniza"] .check.on .box::after{opacity:1;transform:none;animation:flaskFlash .6s ease-out}
@keyframes flaskFlash{0%{filter:brightness(1)}30%{filter:brightness(1.9) drop-shadow(0 0 12px var(--vd-lit))}100%{filter:brightness(1)}}
:root[data-theme="ceniza"] .check.on .box::before{content:none}
:root[data-theme="ceniza"] .crow .box{width:32px;height:32px;margin:-4px 0}
:root[data-theme="ceniza"] .mission .check{align-items:center}
.mission .pts{font-family:var(--disp);color:var(--br);font-size:15px;margin-left:auto;white-space:nowrap}
.mission .tier{font-size:13px;color:var(--txt-3)}

/* Casillas de sesión (slots) */
.slots{display:grid;gap:8px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:10px 8px;text-align:center;clip-path:var(--cut);width:100%;transition:transform .12s,background .15s;background:var(--bg-2);border:1px dashed var(--line-2);color:var(--txt-3)}
.slot:active{transform:scale(.97)}
.slot-t{font-family:var(--disp);font-size:14px;line-height:1.2}
.slot-s{font-size:13px;opacity:.9}
.slot .esc{position:absolute;top:6px;right:6px;font-size:10.5px;padding:0 5px}
.slot.ok{background:var(--vd);border:1px solid var(--vd);color:var(--on-vd)}
.slot.ok .esc{color:var(--on-vd);border-color:rgba(255,255,255,.4)}
.slot.try{background:var(--sur-2);border:1px solid var(--line-2);color:var(--txt-2)}
.slot.bad{background:var(--bad-dim);border:1px solid var(--bad);color:var(--bad-lit)}
.slot-run{flex-direction:row;gap:12px;cursor:default;min-height:58px}
.slot-run input{background:var(--sur-2);border:1px solid var(--line-2);color:var(--txt);font-size:17px;padding:6px 8px;width:86px;text-align:center;font-family:var(--disp)}
.slot-run input:focus{outline:none;border-color:var(--vd)}
.slot-run .u{font-size:14px;color:var(--txt-3)}
.slot-run.ok .u,.slot-run.ok .tick{color:var(--on-vd)}
.slot-run .tick{font-family:var(--disp);font-size:18px;width:18px}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;width:100%;max-width:430px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sur-2);border-top:1px solid var(--line);padding:7px 0 calc(6px + env(safe-area-inset-bottom));height:calc(var(--tabs) + env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--txt-4);font-family:var(--disp);font-size:11px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--vd-lit)}

/* Emblema */
.emb{display:block}
.emb .shield{fill:var(--shield);stroke:var(--br);stroke-width:2.2}
.emb .inner{fill:none;stroke:var(--br-dim);stroke-width:1}
.emb .shield.lit{fill:var(--vd-ghost)}
.emb .chevron{fill:none;stroke:var(--vd);stroke-width:3.2;stroke-linecap:square;stroke-linejoin:miter}
.emb .rays{fill:none;stroke:var(--br-lit);stroke-width:1.8;stroke-linecap:round}
.emb .star{fill:var(--vd)}
.emb .laurel{fill:none;stroke:var(--vd);stroke-width:1.6;stroke-linecap:round}
.emb .crown{fill:none;stroke:var(--br-lit);stroke-width:1.8;stroke-linejoin:round}
/* === Tema Ceniza: retrato del personaje por tramo (img/pj-N.png), como medallón: se funde en círculo === */
.emb.souls{object-fit:contain;object-position:center top;display:block;
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 52%,transparent 71%);mask-image:radial-gradient(circle at 50% 42%,#000 52%,transparent 71%);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.emb.souls.t5{filter:drop-shadow(0 0 3px var(--vd)) drop-shadow(0 0 9px var(--vd-ghost));animation:embglow 2.4s ease-in-out infinite}
/* Tamaños de retrato: valen para cualquier tema en cuanto el emblema es una imagen (.souls) */
:root:has(.emb.souls) .ring .emb{inset:8px;width:96px;height:96px}
:root:has(.emb.souls) .pj .emb{width:170px;height:170px;margin:-12px 0 -6px}
:root:has(.emb.souls) .lvlwin .emb{width:140px;height:140px}
:root:has(.emb.souls) .ca .emb{width:96px;height:96px}
.emb.souls.arcade{image-rendering:pixelated;-webkit-mask-image:none;mask-image:none;filter:none;object-position:center}
/* Botón para elegir nivel (solo prototipo): junto al anillo, abre la hoja de niveles */
.focus-head{position:relative}
.lvl-pick{position:absolute;right:0;top:34px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;font-family:var(--disp);font-size:12px;color:var(--txt-3);border:1px solid var(--line);background:var(--sur)}
.lvl-pick svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="ceniza"] .lvl-pick{background:rgba(58,56,53,.66);border-color:var(--line-2);text-transform:uppercase;letter-spacing:.6px}
.lvl-range{width:100%;accent-color:var(--vd);margin:16px 0 4px}
.lvl-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-4);font-family:var(--disp)}
@keyframes embglow{0%,100%{filter:drop-shadow(0 0 3px var(--vd)) drop-shadow(0 0 8px var(--vd-ghost))}50%{filter:drop-shadow(0 0 5px var(--vd-lit)) drop-shadow(0 0 16px var(--vd-ghost))}}
/* Fondo vivo: ascuas, niebla y hoguera en movimiento, ceñidas al ancho del "teléfono", fijas a la ventana */
.embers{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(430px,100vw);height:100dvh;overflow:hidden;pointer-events:none;z-index:0}
:root:not([data-theme="ceniza"]):not([data-theme="anime"]):not([data-theme="gym"]):not([data-theme="arcade"]) .embers{display:none}
.embers i{position:absolute;bottom:-10px;border-radius:50%;background:var(--vd-lit);box-shadow:0 0 6px 1px var(--vd);opacity:0;animation:ember-rise linear infinite}
@keyframes ember-rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.95}82%{opacity:.4}100%{transform:translateY(-108vh) translateX(var(--drift,14px));opacity:0}}
.embers .fog{position:absolute;inset:-20% -30%;background:
  radial-gradient(38% 26% at 18% 88%,rgba(201,80,45,.16),transparent 70%),
  radial-gradient(45% 30% at 85% 12%,rgba(201,80,45,.1),transparent 70%);
  filter:blur(2px);animation:fog-drift 26s ease-in-out infinite alternate}
@keyframes fog-drift{from{transform:translate(-3%,0) scale(1)}to{transform:translate(3%,-2%) scale(1.06)}}
/* Hoguera: resplandor anclado abajo del que "nacen" las ascuas, con la silueta de la hoguera (espada y montículo) difuminada detrás */
.embers .fire{position:absolute;left:0;right:0;bottom:-12%;height:46%;background:radial-gradient(60% 100% at 50% 100%,rgba(233,116,63,.5),rgba(201,80,45,.22) 45%,transparent 75%);animation:fire-pulse 3.4s ease-in-out infinite}
@keyframes fire-pulse{0%,100%{opacity:.75}50%{opacity:1}}
/* Hoguera: imagen generada (img/hoguera.png, espada enroscada clavada en la ceniza, con transparencia
   real). Muy difuminada y solo asoman la espada y el fuego: el montículo queda tras la barra de
   pestañas. Sin pulso ni movimiento; de ella nacen las ascuas. */
.embers .bonfire{position:absolute;left:50%;bottom:calc(var(--tabs) + env(safe-area-inset-bottom) - 96px);width:320px;aspect-ratio:1;margin-left:-160px;background:url(img/hoguera.png) center/contain no-repeat;filter:blur(5px);opacity:.55}
.top,main,.tabs{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.embers{display:none}}
/* Paneles: losas de ceniza translúcidas (se entrevén las ascuas del fondo), bordes rectos sin adorno
   y, de vez en cuando, una esquina desportillada. Nada de grietas ni franjas de color. */
:root[data-theme="ceniza"] :is(.card,.pj,.tramos,.metric,.cta,.ach,.own,.chart,.tile,.set,.tpl,.bchip,.fb,.pick-b,.strip button,.slot,.toast,.sheet){
  position:relative; border-radius:0; border:none;
  clip-path:var(--stone-clip);-webkit-clip-path:var(--stone-clip);
  background-color:rgba(58,56,53,.66);
  background-image:radial-gradient(60% 50% at 50% 0%,rgba(255,245,230,.05),transparent 70%);
  box-shadow:
    inset 0 0 0 1px rgba(255,245,230,.09),
    inset 0 -4px 8px rgba(0,0,0,.35);
}
/* Fuera de Semana (Personaje, Logros, Estadísticas, Más) la losa es opaca: el texto no pelea con las ascuas del fondo. */
:root[data-theme="ceniza"] :is(#personaje,#logros,#stats,#mas) :is(.card,.pj,.tramos,.metric,.cta,.ach,.own,.chart,.tile,.set,.tpl,.strip button,.slot){background-color:#34322F;background-image:none}
:root[data-theme="ceniza"] :is(#personaje,#logros,#stats,#mas) .row{background:#34322F}
/* Esquinas carcomidas, sutiles y solo en la pantalla Semana: máscara de 9 rebanadas (img/losa-*.png,
   generadas por img/mascaras.py): la esquina rota sale de la imagen y el resto se estira, así el canto
   sigue recto. Por posición entre hermanos, parece azar pero no cambia al recargar. Firefox no
   soporta mask-border: allí salen rectas. */
:root[data-theme="ceniza"] #semana :is(.card,.bchip,.fb,.slot,.next):nth-child(7n+3){-webkit-mask-box-image:url(img/losa-tr.png) 40 stretch;mask-border:url(img/losa-tr.png) 40 fill}
:root[data-theme="ceniza"] #semana :is(.card,.bchip,.fb,.slot,.next):nth-child(11n+5){-webkit-mask-box-image:url(img/losa-bl.png) 40 stretch;mask-border:url(img/losa-bl.png) 40 fill}
:root[data-theme="ceniza"] #semana :is(.card,.bchip,.fb,.slot,.next):nth-child(13n+1){-webkit-mask-box-image:url(img/losa-br.png) 40 stretch;mask-border:url(img/losa-br.png) 40 fill}
/* Estados "hecho": brasa incrustada en la ceniza */
:root[data-theme="ceniza"] .slot.ok,:root[data-theme="ceniza"] .bchip.done{
  background-color:var(--vd);
  background-image:radial-gradient(60% 50% at 50% 0%,rgba(255,245,230,.14),transparent 70%);
  box-shadow:inset 0 0 0 1px var(--vd-lit),inset 0 -4px 8px rgba(0,0,0,.35),inset 0 0 14px rgba(240,138,78,.35);
}
:root[data-theme="ceniza"] .slot.try{background-color:var(--sur-2)}
:root[data-theme="ceniza"] .pj,:root[data-theme="ceniza"] .sheet.pop{box-shadow:inset 0 0 0 1px var(--vd),inset 0 -4px 7px rgba(0,0,0,.4),inset 0 0 28px rgba(201,80,45,.14)}
:root[data-theme="ceniza"] .sheet{background-color:rgba(44,42,40,.94)}
:root[data-theme="ceniza"] .btn{background:linear-gradient(180deg,var(--vd-lit),var(--vd) 60%,var(--vd-dim));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.3),0 0 18px rgba(201,80,45,.4);letter-spacing:1.2px;text-transform:uppercase;font-size:14px;border-radius:2px}
:root[data-theme="ceniza"] .btn:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 2px 5px rgba(0,0,0,.45)}
:root[data-theme="ceniza"] .btn-2{box-shadow:inset 0 0 0 1px var(--line-2),inset 0 0 12px rgba(0,0,0,.4);letter-spacing:1px;text-transform:uppercase;font-size:13.5px;border-radius:2px;border:1px solid var(--line-2)}
:root[data-theme="ceniza"] .top{background:linear-gradient(var(--bg) 60%,transparent);border-bottom:1px solid var(--line)}
:root[data-theme="ceniza"] .brand{letter-spacing:1px;text-shadow:0 0 12px var(--vd-ghost)}
:root[data-theme="ceniza"] nav.tabs .in{box-shadow:inset 0 1px 0 var(--line-2),0 -6px 20px rgba(0,0,0,.4)}
:root[data-theme="ceniza"] .ring .arc .fg{filter:drop-shadow(0 0 5px var(--vd))}
:root[data-theme="ceniza"] .pj .t,:root[data-theme="ceniza"] .focus-head .t,:root[data-theme="ceniza"] .lvlwin .tt,:root[data-theme="ceniza"] .tramo .name{
  font-family:var(--disp-med);font-weight:600;text-transform:none;letter-spacing:.3px;text-shadow:0 0 14px var(--vd-ghost)}
:root[data-theme="ceniza"] .pj .t,:root[data-theme="ceniza"] .lvlwin .tt{font-size:36px;line-height:1.05;letter-spacing:.8px}
:root[data-theme="ceniza"] .focus-head .t{font-size:38px;line-height:1.05;letter-spacing:.8px;margin-top:12px;max-width:100%}
/* Cabeceras de sección: marca en forma de rombo encendido y línea que se apaga */
:root[data-theme="ceniza"] .h{letter-spacing:.6px}
:root[data-theme="ceniza"] .h::before{content:'';flex:none;width:6px;height:6px;background:var(--vd);transform:rotate(45deg);box-shadow:0 0 6px var(--vd)}
:root[data-theme="ceniza"] .h::after{background:linear-gradient(90deg,var(--line-2),transparent)}
/* Divisor ornamental (usado en las hojas modales): rombo más grande y con brillo */
:root[data-theme="ceniza"] .orn i{width:8px;height:8px;box-shadow:0 0 8px var(--vd)}
:root[data-theme="ceniza"] .orn>span{background:linear-gradient(90deg,transparent,var(--line-2))}
:root[data-theme="ceniza"] .orn>span:last-child{background:linear-gradient(90deg,var(--line-2),transparent)}
/* Cierre de semana: cabecera de la hoja como un título de victoria, metric como placas de rango */
:root[data-theme="ceniza"] .sheet h2{text-transform:uppercase;letter-spacing:1.5px;font-size:19px;text-shadow:0 0 16px var(--vd-ghost)}
:root[data-theme="ceniza"] .metric .v{text-shadow:0 0 10px var(--vd-ghost)}
:root[data-theme="ceniza"] .ledger{border-top-color:var(--line-2);border-bottom-color:var(--line-2);position:relative}
:root[data-theme="ceniza"] .ledger div{border-bottom:1px dotted var(--line)}
:root[data-theme="ceniza"] .ledger div:last-child{border-bottom:none}
:root[data-theme="ceniza"] .ledger .tot{text-transform:uppercase;letter-spacing:1px;text-shadow:0 0 12px var(--vd-ghost)}
:root[data-theme="ceniza"] .steps-pick .crow{border:1px solid var(--line-2);border-radius:2px;padding-left:8px}
:root[data-theme="ceniza"] .steps-pick .crow.on{border-color:var(--vd);box-shadow:0 0 10px rgba(201,80,45,.3)}
/* Tipografía: Cinzel en negrita (lo más cercano a la fuente real de Dark Souls, Optimus Princeps)
   para títulos grabados en mayúsculas, itálica de Garamond para subtítulos y avisos de cronista. */
:root[data-theme="ceniza"] .h,:root[data-theme="ceniza"] .lvlwin .k,
:root[data-theme="ceniza"] .ca .tt,:root[data-theme="ceniza"] .own .t,
:root[data-theme="ceniza"] .cta b,:root[data-theme="ceniza"] .toast .n,
:root[data-theme="ceniza"] .sheet h2,:root[data-theme="ceniza"] .top .brand,
:root[data-theme="ceniza"] .set .t,:root[data-theme="ceniza"] .tpl .t,:root[data-theme="ceniza"] .bchip,
:root[data-theme="ceniza"] .fb .fh .n,:root[data-theme="ceniza"] .pick-b{
  font-weight:700;letter-spacing:.8px;text-transform:uppercase;
}
:root[data-theme="ceniza"] .sheet .sub,:root[data-theme="ceniza"] .hint,:root[data-theme="ceniza"] .toast .d,
:root[data-theme="ceniza"] .pj .n,:root[data-theme="ceniza"] .tramo small,:root[data-theme="ceniza"] .fb .desc{
  font-family:var(--disp-sub);font-style:italic;font-weight:500;font-size:15px;letter-spacing:.2px;text-transform:none;
}
/* Indicadores semanales de bloque: puñales pequeños (hoja, guarda, empuñadura y pomo), apagados o al rojo */
:root[data-theme="ceniza"]{--flame-clip:polygon(50% 100%,66% 60%,66% 44%,96% 42%,96% 34%,64% 32%,64% 14%,72% 10%,72% 0%,28% 0%,28% 10%,36% 14%,36% 32%,4% 34%,4% 42%,34% 44%,34% 60%)}
:root[data-theme="ceniza"] .bchip .meter i,:root[data-theme="ceniza"] .pick-b .meter i{
  width:11px;height:17px;border:none;background:var(--txt-4);opacity:.6;
  clip-path:var(--flame-clip);-webkit-clip-path:var(--flame-clip);
}
:root[data-theme="ceniza"] .bchip .meter i.on,:root[data-theme="ceniza"] .pick-b .meter i.on{
  background:var(--vd);opacity:1;filter:drop-shadow(0 0 3px var(--vd));
}
:root[data-theme="ceniza"] .bchip .meter i.half,:root[data-theme="ceniza"] .pick-b .meter i.half{
  background:linear-gradient(to bottom,var(--vd) 0 50%,var(--txt-4) 50% 100%);opacity:.9;
}
:root[data-theme="ceniza"] .bchip.done .meter i{background:var(--on-vd);opacity:.5}
:root[data-theme="ceniza"] .bchip.done .meter i.on{background:var(--on-vd);opacity:1;filter:none}
/* Subir/bajar de nivel: el fogonazo y la revelación de letras de una hoguera de Dark Souls */
:root[data-theme="ceniza"] .overlay.center::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 50% 38%,rgba(255,214,150,.9),rgba(233,116,63,.35) 35%,transparent 70%);
  opacity:0;animation:soulsFlash 1.1s ease-out both;
}
@keyframes soulsFlash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
:root[data-theme="ceniza"] .overlay.center:has(.lvlwin.down)::before{
  background:radial-gradient(circle at 50% 38%,rgba(180,40,30,.85),rgba(60,10,10,.4) 40%,transparent 72%);
}
:root[data-theme="ceniza"] .overlay.center:has(.lvlwin.down){animation:soulsShake .5s ease-in-out}
@keyframes soulsShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
:root[data-theme="ceniza"] .overlay.center:has(.lvlwin.down) .sheet.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1),soulsDim .9s ease-out}
@keyframes soulsDim{0%{filter:grayscale(1) brightness(.4)}100%{filter:none}}
:root[data-theme="ceniza"] .lvlwin .k{display:block;animation:soulsKerning 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes soulsKerning{0%{letter-spacing:14px;opacity:0}60%{opacity:1}100%{letter-spacing:2px;opacity:1}}
:root[data-theme="ceniza"] .lvlwin .tt{animation:soulsTitleIn .8s ease-out .25s both}
@keyframes soulsTitleIn{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
:root[data-theme="ceniza"] .lvlwin.down .tt{color:var(--bad-lit)}
:root[data-theme="ceniza"] .ca.bump{animation:bump .55s cubic-bezier(.2,.8,.2,1),soulsBumpFlash .55s ease-out}
@keyframes soulsBumpFlash{0%{filter:drop-shadow(0 0 0 transparent)}30%{filter:drop-shadow(0 0 22px var(--vd))}100%{filter:drop-shadow(0 0 0 transparent)}}
@media(prefers-reduced-motion:reduce){:root[data-theme="ceniza"] .overlay.center::before,:root[data-theme="ceniza"] .lvlwin .k,:root[data-theme="ceniza"] .lvlwin .tt{animation:none}}

/* Personaje */
.pj{display:flex;flex-direction:column;align-items:center;padding:26px 18px 20px;gap:6px;text-align:center;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut-lg)}
.pj .emb{width:136px;height:136px}
.pj .t{font-family:var(--disp);font-size:24px;margin:8px 0 0;text-wrap:balance;line-height:1.15}
.pj .n{font-size:15px;color:var(--txt-3);margin:0}
.pj .lvl{font-family:var(--disp);font-size:15px;color:var(--br);margin:2px 0 0}
.pj .xp{width:100%}
.tramos{display:flex;flex-direction:column;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.tramo{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--txt-3);font-size:14.5px}
.tramo:last-child{border-bottom:none}
.tramo .emb{width:36px;height:36px;opacity:.5}
:root:has(.emb.souls) .tramo .emb{width:50px;height:50px}
.tramo.now{color:var(--txt);background:var(--vd-ghost)}
.tramo.now .emb{opacity:1}
.tramo .name{font-family:var(--disp)}
.tramo small{display:block;font-size:13px;color:var(--txt-4);font-family:var(--sans)}
.tramo .r{font-size:13.5px;color:var(--txt-4)}
.tramo.now .r{color:var(--vd-lit)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{padding:12px 6px 10px;text-align:center;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.metric .v{font-family:var(--disp);font-size:21px;color:var(--txt);margin:0}
.metric .v small{font-size:13px;color:var(--txt-3);font-family:var(--sans)}
.metric .k{font-size:13px;color:var(--txt-3);margin:1px 0 0}
.metric .up{font-size:13px;color:var(--vd-lit);margin:1px 0 0}
.metric .up.none{color:var(--txt-4)}
.metric.add{border-style:dashed;color:var(--txt-3);display:flex;align-items:center;justify-content:center;font-size:13.5px;min-height:74px}
.cta{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;width:100%;text-align:left;background:var(--sur);border:1px solid var(--br-dim);clip-path:var(--cut)}
.cta b{font-family:var(--disp);font-weight:400;font-size:16px}
.cta small{display:block;color:var(--txt-3);font-size:13.5px}

/* Logros */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);clip-path:var(--cut)}
.seg button{padding:11px;font-family:var(--disp);font-size:14px;color:var(--txt-3)}
.seg button.on{background:var(--sur-2);color:var(--vd-lit);box-shadow:inset 0 -2px 0 var(--vd)}
.ach{padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.ach-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ach-top .t{font-family:var(--disp);font-size:15px;margin:0}
.ach-top .tierp{font-size:13px;padding:1px 8px;border:1px solid;white-space:nowrap}
.bar{height:7px;background:var(--deep);border:1px solid var(--line-2)}
.bar>i{display:block;height:100%;transition:width .6s}
.ach-foot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--txt-3)}
.ach-foot b{font-weight:500;color:var(--br)}
.own{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.own.on{border-color:var(--vd);background:var(--vd-ghost)}
.own .t{font-size:15px;margin:0;line-height:1.3}
.own .t small{display:block;color:var(--txt-4);font-size:13px;margin-top:2px}
.own .p{font-family:var(--disp);color:var(--br);font-size:14px;white-space:nowrap}
.own.on .p{color:var(--vd-lit)}
.own.on .p::before{content:'✓ '}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Estadísticas */
.chart{padding:14px 12px 10px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.chart svg{width:100%;height:auto;display:block}
.chart .t{font-size:11.5px;fill:var(--txt-4);font-family:var(--sans)}
.chart .t.g{fill:var(--vd-lit);font-family:var(--disp);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--vd-dim)}
.chart .b.now{fill:var(--vd)}
.chart .ln{fill:none;stroke:var(--vd);stroke-width:2;stroke-linejoin:round}
.chart .ln.br{stroke:var(--br)}
.chart .ar{fill:var(--vd-ghost)}
.chart .pt{fill:var(--vd-lit)}
.chart .pt.soft{fill:var(--sur);stroke:var(--vd);stroke-width:1.5}
.chart .pt.br{fill:var(--br)}
.chart .pt.hollow{fill:var(--sur);stroke:var(--line-2);stroke-width:1.5}
.chart .t.g.br{fill:var(--br)}
.chart .grid.dash{stroke:var(--line-2);stroke-dasharray:3 4}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;background:var(--sur);border:1px solid var(--line);font-size:15px;color:var(--txt-2)}
.row b{font-family:var(--disp);font-weight:400;color:var(--txt)}
.row small{color:var(--txt-4);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{padding:12px 14px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.tile .v{font-family:var(--disp);font-size:22px;margin:0;color:var(--txt)}
.tile .v small{font-family:var(--sans);font-size:13px;color:var(--txt-3)}
.tile .k{font-size:13px;color:var(--txt-3);margin:0}
.hbar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:14px;color:var(--txt-2);padding:6px 0}
.hbar .bar{height:9px}
.hbar b{font-family:var(--disp);font-weight:400;color:var(--txt);white-space:nowrap}

/* Más */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.set .t{margin:0;font-size:15.5px}
.set .t small{display:block;color:var(--txt-4);font-size:13px}
.set .v{color:var(--vd-lit);font-family:var(--disp);font-size:14px;white-space:nowrap}
.tpl{display:flex;flex-direction:column;gap:3px;padding:12px 14px;width:100%;text-align:left;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut)}
.tpl.on{border-color:var(--vd);background:var(--vd-ghost)}
.tpl .t{font-family:var(--disp);font-size:15.5px;margin:0;display:flex;justify-content:space-between;gap:10px}
.tpl .t span:last-child{font-family:var(--sans);font-size:13px;color:var(--vd-lit)}
.tpl .d{font-size:13.5px;color:var(--txt-3);margin:0}
.tpl .b{font-size:13px;color:var(--txt-4);margin:0}

/* Ventanas */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,24,22,.62);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{position:relative;width:100%;max-width:430px;max-height:92dvh;overflow:auto;background:var(--bg-2);border:1px solid var(--vd);border-bottom:none;padding:22px 20px calc(22px + env(safe-area-inset-bottom));clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet .x{position:absolute;top:8px;right:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--txt-3);z-index:1}
.sheet .x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.sheet h2{padding:0 28px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--disp);font-weight:400;font-size:21px;color:var(--txt);text-align:center;margin:0}
.sheet .sub{text-align:center;color:var(--txt-3);font-size:14.5px;margin:4px 0 0}
.sheet .orn{margin:12px 0 14px}
.sheet .h{margin:14px 0 6px}
.frow{display:grid;grid-template-columns:1fr auto 80px;gap:12px;align-items:center;padding:6px 0}
.frow .n{font-size:15.5px;color:var(--txt-2)}
.frow .o{font-size:13.5px;color:var(--txt-3);white-space:nowrap}
.frow input,.frow select{background:var(--sur-2);border:1px solid var(--line-2);color:var(--txt);font-size:17px;padding:8px;width:100%;text-align:center;font-family:var(--disp)}
.frow input:focus,.frow select:focus{outline:none;border-color:var(--vd)}
.frow input.hit{border-color:var(--vd);color:var(--vd-lit)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:15.5px;color:var(--txt-2);width:100%;text-align:left}
.crow .box{margin:0}
.crow small{color:var(--txt-4);font-size:13px}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
.actions .btn-2{padding:13px 18px;width:auto}
.ledger{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:14px 0;font-size:15px;color:var(--txt-2)}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.ledger .plus{color:var(--vd-lit)}.ledger .minus{color:var(--bad-lit)}
.ledger .tot{font-family:var(--disp);font-size:20px;color:var(--txt);padding-top:10px}
.steps-pick{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px}
.steps-pick .crow{padding:7px 0;font-size:14.5px}
.steps-pick .crow.off{color:var(--txt-4)}
.count{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.count .big{font-family:var(--disp);font-size:48px;line-height:1;color:var(--vd-lit)}
.count .k{font-size:14px;color:var(--txt-3)}
/* Cierre de semana: la experiencia entra en la barra y, si se llena (o se vacía), cambia el nivel */
.ca{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;margin-top:4px}
.ca .emb{width:72px;height:72px}
.ca .lv{font-family:var(--disp);font-size:15px;margin:6px 0 0;color:var(--br)}
.ca .tt{font-family:var(--disp);font-size:20px;margin:0;color:var(--txt);line-height:1.15}
.ca .xp{width:100%}
.ca .xp>i{transition:none}
.ca .xp-txt{width:100%}
.ca .msg{font-family:var(--disp);font-size:17px;margin:12px 0 0;min-height:22px;color:var(--vd-lit);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.ca .msg.on{opacity:1;transform:none}
.ca .msg.down{color:var(--bad-lit)}
.ca .msg.same{font-family:var(--sans);font-size:14px;color:var(--txt-3)}
.ca.bump .emb,.ca.bump .lv{animation:bump .55s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}

/* Semana, disposición Fusión: anillo, misión, bloques como chips y el elegido desplegado */
.focus-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding-top:4px}
.ring{position:relative;width:112px;height:112px}
.ring svg.arc{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .arc circle{fill:none;stroke-width:5}
.ring .arc .bg{stroke:var(--deep)}
.ring .arc .fg{stroke:var(--vd);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .emb{position:absolute;inset:18px;width:76px;height:76px}
.focus-head .t{font-family:var(--disp);font-size:20px;margin:10px 0 0;line-height:1.15;text-wrap:balance}
.focus-head .s{font-size:13.5px;color:var(--txt-3);margin:0}
.focus-head .s b{font-family:var(--disp);font-weight:400;color:var(--br);font-size:15px}
.focus-head .x{font-size:13.5px;color:var(--txt-3);margin:4px 0 0}
.focus-head .x b{font-weight:500;color:var(--txt-2)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:8px 11px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut);font-family:var(--disp);font-size:14px;color:var(--txt-3);flex:1 1 auto;min-width:92px;text-align:left;transition:background .15s}
.bchip .meter i{width:9px;height:5px}
.bchip small{font-family:var(--sans);font-size:12px;color:var(--txt-4)}
.bchip.on{border-color:var(--vd);background:var(--vd-ghost);color:var(--txt)}
.bchip.done{background:var(--vd);border-color:var(--vd);color:var(--on-vd)}
.bchip.done small{color:var(--on-vd);opacity:.85}
.bchip.done .meter i{background:rgba(255,255,255,.28);border-color:transparent}
.bchip.done .meter i.on{background:var(--on-vd)}
.bchip.done.on{box-shadow:inset 0 0 0 2px var(--on-vd)}
.fb{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut-lg)}
.fb .fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fb .fh .n{font-family:var(--disp);font-size:18px;margin:0;display:flex;align-items:center;gap:10px}
.fb .desc{font-size:14px;color:var(--txt-3);margin:0;line-height:1.4}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--bg-2);font-size:14px;color:var(--txt-2)}
.next b{font-family:var(--disp);font-weight:400;color:var(--txt)}
.mission .card{padding:14px 16px}

/* Pantalla de entrada: qué has hecho hoy */
.entry{position:fixed;inset:0;z-index:15;display:none;justify-content:center;background:var(--out)}
.entry.on{display:flex}
.entry .in{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--txt)}
.entry .eh{flex:none;padding:calc(20px + env(safe-area-inset-top)) 20px 12px;display:flex;flex-direction:column;gap:4px}
.entry .eh .t{font-family:var(--disp);font-size:22px;margin:0;line-height:1.15}
.entry .eh .s{font-size:14px;color:var(--txt-3);margin:0}
.entry .eh .s b{font-weight:500;color:var(--txt-2)}
.entry .eb{flex:1;overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.entry .ef{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);background:var(--sur-2)}
.entry .btn[disabled]{opacity:.5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick-b{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;min-height:78px;background:var(--sur);border:1px solid var(--line);clip-path:var(--cut);font-family:var(--disp);font-size:15px;color:var(--txt-2);text-align:left;position:relative}
.pick-b small{font-family:var(--sans);font-size:12.5px;color:var(--txt-4)}
.pick-b .meter{margin-top:auto}
.pick-b .meter i{width:9px;height:5px}
.pick-b.sel{border-color:var(--vd);background:var(--vd-ghost);color:var(--txt);box-shadow:inset 0 0 0 1px var(--vd)}
.pick-b.sel::after{content:'';position:absolute;top:10px;right:10px;width:8px;height:8px;transform:rotate(45deg);background:var(--vd)}
.pick-b.done{background:var(--vd);border-color:var(--vd);color:var(--on-vd)}
.pick-b.done small{color:var(--on-vd);opacity:.85}
.pick-b.done .meter i{background:rgba(255,255,255,.28);border-color:transparent}
.pick-b.done .meter i.on{background:var(--on-vd)}
.pick-b.done.sel{box-shadow:inset 0 0 0 2px var(--on-vd)}
.pick-b.done.sel::after{background:var(--on-vd)}
.steps-bar{display:flex;gap:4px}
.steps-bar i{flex:1;height:4px;background:var(--deep);border:1px solid var(--line-2)}
.steps-bar i.on{background:var(--vd);border-color:var(--vd)}
.entry .fb .desc{display:none}

/* Trofeo emergente */
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{display:flex;align-items:center;gap:12px;width:100%;max-width:400px;background:var(--sur-2);border:1px solid var(--br);border-left-width:4px;padding:11px 14px;clip-path:var(--cut);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .45s cubic-bezier(.2,.8,.2,1) both,tout .5s ease-in 5.5s both}
.toast .ico{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--br-dim);background:var(--sur)}
.toast .ico svg{width:22px;height:22px;stroke:var(--br);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.toast .k{margin:0;font-size:13px;color:var(--br)}
.toast .n{margin:1px 0 0;font-family:var(--disp);font-size:15px;color:var(--txt);line-height:1.25}
.toast .d{margin:1px 0 0;font-size:13.5px;color:var(--txt-3)}
.ring.bump{animation:bump .55s cubic-bezier(.2,.8,.2,1)}
/* Ventana de cambio de nivel: centrada, por delante de todo */
.overlay.center{align-items:center;padding:0 22px}
.sheet.pop{max-width:360px;max-height:none;border:1px solid var(--vd);clip-path:var(--cut-lg);padding:26px 22px 22px;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.lvlwin{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.lvlwin .k{font-family:var(--disp);font-size:15px;color:var(--vd-lit);margin:0 0 10px;letter-spacing:.3px}
.lvlwin .emb{width:104px;height:104px;animation:bump .7s cubic-bezier(.2,.8,.2,1) .2s}
.lvlwin .lv{font-family:var(--disp);font-size:15px;color:var(--br);margin:12px 0 0}
.lvlwin .tt{font-family:var(--disp);font-size:24px;color:var(--txt);margin:0;line-height:1.15;text-wrap:balance}
.lvlwin .hint{margin:10px 0 18px}
.lvlwin .btn{width:100%}
.lvlwin.down .k{color:var(--bad-lit)}
.sheet.pop .x{display:none}
@keyframes tin{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes tout{from{opacity:1}to{opacity:0;transform:translateY(-16px)}}
@media(prefers-reduced-motion:reduce){.toast,.sheet{animation:none}.xp>i,.bar>i,.ring .arc .fg{transition:none}}
/* ================= Tema Anime: tinta y papel (hechiceros, maldiciones, energía violeta) ================= */
/* Fondo negro violeta (el azul marino se confundía con 8 bits): el progreso es energía maldita violeta y el rango, rojo de sello. */
:root[data-theme="anime"]{
  --bg:#120A1E; --bg-2:#1A1029; --sur:#F6F4EE; --sur-2:#22163A; --deep:#0A0512;
  --line:#33244F; --line-2:#4B3672;
  --vd:#7A3BFF; --vd-lit:#AB8BFF; --vd-dim:#DDD0FF; --vd-ghost:rgba(122,59,255,.16);
  --br:#D3242B; --br-lit:#F04B52; --br-dim:#F3C6C8; --br-ghost:rgba(211,36,43,.12);
  --txt:#F4F4FA; --txt-2:#C9CBE0; --txt-3:#8E92B8; --txt-4:#5E6288;
  --bad:#D3242B; --bad-dim:#F6D7D8; --bad-lit:#B0161C;
  --on-vd:#FFFFFF; --shield:#F6F4EE; --out:#07030E;
  --bronce:#B87333; --plata:#C7CBD6; --oro:#F2C230; --platino:#DDE7F2; --diamante:#6FD3F5; --leyenda:#A67CF5;
  --disp:'Bangers',Impact,'Arial Narrow',sans-serif;
  --sans:'Zen Kaku Gothic New','Noto Sans JP','Segoe UI',sans-serif;
  --cut:none; --cut-lg:none;
  color-scheme:dark;
}
/* Viñetas de manga: papel liso, borde de tinta grueso y sombra dura desplazada.
   Dentro de la viñeta el texto es de tinta (los tokens de texto se redefinen en la propia caja). */
:root[data-theme="anime"] :is(.card,.pj,.tramos,.metric,.cta,.ach,.own,.chart,.tile,.set,.tpl,.bchip,.fb,.pick-b,.strip button,.slot,.toast){
  --txt:#15161C; --txt-2:#33354A; --txt-3:#5F6280; --txt-4:#8F92AD; --line:#15161C; --line-2:#15161C;
  --sur-2:#FFFFFF; --deep:#E9E6DE; --bg-2:#EFECE4; --vd-ghost:rgba(122,59,255,.12); --br-ghost:rgba(211,36,43,.1);
  border-radius:0;border:3px solid #15161C;color:var(--txt);
  background:#F6F4EE;
  box-shadow:4px 4px 0 #15161C;
}
:root[data-theme="anime"] .slot{border-style:solid}
:root[data-theme="anime"] .slot.ok,:root[data-theme="anime"] .bchip.done,:root[data-theme="anime"] .pick-b.done{background:var(--vd);border-color:#15161C;color:#fff;--txt-4:#fff}
:root[data-theme="anime"] .slot.try{background:#fff}
:root[data-theme="anime"] .bchip.on{box-shadow:4px 4px 0 var(--vd)}
:root[data-theme="anime"] .bchip.done.on{box-shadow:4px 4px 0 #15161C,inset 0 0 0 2px #fff}
:root[data-theme="anime"] .pick-b.sel{box-shadow:4px 4px 0 var(--vd)}
:root[data-theme="anime"] .pick-b.sel::after{background:var(--br)}
:root[data-theme="anime"] .btn{background:#15161C;color:#fff;border:2px solid #fff;box-shadow:4px 4px 0 var(--vd);letter-spacing:1.5px;font-size:18px;transform:skewX(-6deg);border-radius:0}
:root[data-theme="anime"] .btn:active{transform:skewX(-6deg) translate(2px,2px);box-shadow:2px 2px 0 var(--vd)}
:root[data-theme="anime"] .btn-2{background:transparent;border:2px solid var(--line-2);color:var(--txt-2);font-family:var(--disp);font-size:16px;letter-spacing:1px}
:root[data-theme="anime"] .h{font-size:18px;letter-spacing:1.2px;color:#fff}
:root[data-theme="anime"] .h::after{background:linear-gradient(90deg,var(--br),transparent);height:2px}
:root[data-theme="anime"] :is(.card,.pj,.tramos,.metric,.cta,.ach,.own,.chart,.tile,.set,.tpl,.bchip,.fb,.pick-b,.strip button,.slot,.toast) .h{color:#15161C}
:root[data-theme="anime"] .pj .t,:root[data-theme="anime"] .focus-head .t,:root[data-theme="anime"] .lvlwin .tt{
  font-size:40px;letter-spacing:1.5px;line-height:1.05;color:#fff;
  text-shadow:3px 3px 0 #15161C,-1px -1px 0 #15161C,1px -1px 0 #15161C,-1px 1px 0 #15161C,1px 1px 0 #15161C}
:root[data-theme="anime"] .pj .t{-webkit-text-stroke:.5px #15161C}
:root[data-theme="anime"] .top .brand{letter-spacing:2px;font-size:22px}
:root[data-theme="anime"] .top .brand b{color:var(--vd-lit)}
:root[data-theme="anime"] nav.tabs .in{border-top:3px solid #F6F4EE;background:#0C0716}
:root[data-theme="anime"] nav.tabs button{letter-spacing:.8px;font-size:12px}
:root[data-theme="anime"] .sheet{border:3px solid #F6F4EE;background:var(--bg-2);clip-path:none}
:root[data-theme="anime"] .sheet.pop{border-color:#F6F4EE}
:root[data-theme="anime"] .sheet h2{font-size:26px;letter-spacing:2px}
:root[data-theme="anime"] .ring .arc .fg{filter:drop-shadow(0 0 4px var(--vd))}
:root[data-theme="anime"] .ring .arc .bg{stroke:#261A3E}
:root[data-theme="anime"] .esc{border-width:2px;font-weight:700}
:root[data-theme="anime"] .lvl-pick{background:#15161C;border:2px solid #fff;color:#fff;letter-spacing:1px}
/* Check de misión: sello hanko. Vacío es un círculo de puntos donde irá el sello; al cumplirse cae de golpe
   un sello rojo de doble anillo, algo torcido, con 済 ("hecho") en blanco. */
:root[data-theme="anime"] .box{width:34px;height:34px;margin:-6px 0 -4px;border:2px dashed #B5B8C8;border-radius:50%;background:transparent;position:relative;transition:none;display:grid;place-items:center}
:root[data-theme="anime"] .box::before{content:none}
:root[data-theme="anime"] .check.on .box{border:2.5px solid #B81C22;background:radial-gradient(circle at 35% 30%,#E8464D,#C42027 70%);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px #C42027;transform:rotate(-12deg);animation:an-stamp .4s cubic-bezier(.2,1.4,.4,1)}
:root[data-theme="anime"] .check.on .box::after{content:'済';position:static;inset:auto;background:none;font-family:var(--sans);font-weight:700;font-size:15px;line-height:1;color:#fff}
@keyframes an-stamp{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-12deg);opacity:1}100%{transform:rotate(-12deg)}}
:root[data-theme="anime"] .mission .check{align-items:center}
:root[data-theme="anime"] .crow .box{width:28px;height:28px;margin:0}
:root[data-theme="anime"] .crow.on .box::after{font-size:12px}
/* Indicadores de bloque: sellos pequeños. Hueco de puntos si falta, medio sello si se intentó, sello rojo de doble anillo si está hecha. */
:root[data-theme="anime"] :is(.bchip,.pick-b) .meter{gap:5px}
:root[data-theme="anime"] .bchip .meter i,:root[data-theme="anime"] .pick-b .meter i{width:14px;height:14px;border-radius:50%;border:1.5px dashed #B5B8C8;background:transparent;clip-path:none}
:root[data-theme="anime"] .bchip .meter i.on,:root[data-theme="anime"] .pick-b .meter i.on{border:1.5px solid #C42027;background:#C42027;box-shadow:inset 0 0 0 1.5px #fff,inset 0 0 0 3px #C42027;filter:none}
:root[data-theme="anime"] .bchip .meter i.half,:root[data-theme="anime"] .pick-b .meter i.half{border:1.5px solid #C42027;background:linear-gradient(to top,#C42027 50%,transparent 50%)}
:root[data-theme="anime"] :is(.bchip.done,.pick-b.done) .meter i{border-color:rgba(255,255,255,.6);background:transparent}
:root[data-theme="anime"] :is(.bchip.done,.pick-b.done) .meter i.on{background:#fff;border-color:#fff;box-shadow:inset 0 0 0 1.5px var(--vd),inset 0 0 0 3px #fff;filter:none}
:root[data-theme="anime"] :is(.bchip.done,.pick-b.done) .meter i.half{background:linear-gradient(to top,#fff 50%,transparent 50%);border-color:#fff}
/* Fondo vivo: nieblas de energía maldita (violeta y carmesí) a la deriva, jirones de energía que suben
   ondulando, líneas de velocidad desde la esquina que estallan cada pocos segundos, y trama de semitono abajo */
:root[data-theme="anime"] .embers{background:radial-gradient(60% 40% at 50% 100%,rgba(122,59,255,.12),transparent 70%)}
.embers .an-fog{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;filter:blur(46px);opacity:.6;animation:an-drift 22s ease-in-out infinite alternate}
.embers .an-fog.a{left:-22%;top:6%;background:radial-gradient(circle,rgba(122,59,255,.6),transparent 65%)}
.embers .an-fog.b{right:-26%;top:44%;background:radial-gradient(circle,rgba(196,32,39,.45),transparent 65%);animation-delay:-11s;animation-direction:alternate-reverse}
@keyframes an-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(9%,-12%) scale(1.18)}}
.embers .an-wisp{position:absolute;bottom:-4%;border-radius:50%;background:radial-gradient(circle,#EDE4FF,rgba(171,139,255,.9) 40%,rgba(122,59,255,.5) 65%,transparent 75%);box-shadow:0 0 10px 2px rgba(122,59,255,.45);opacity:0;animation:an-rise linear infinite}
@keyframes an-rise{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.85}50%{transform:translate(var(--sway),-50vh) scale(1)}88%{opacity:.5}100%{transform:translate(0,-104vh) scale(.5);opacity:0}}
.embers .an-lines{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 106% -6%,rgba(255,255,255,.14) 0 .45deg,transparent .45deg 3.4deg);opacity:.35;animation:an-burst 6.5s steps(1) infinite}
@keyframes an-burst{0%,86%{opacity:.35}88%{opacity:1}90%{opacity:.5}92%{opacity:1}96%{opacity:.35}}
.embers .an-dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1.3px);background-size:6px 6px;-webkit-mask-image:linear-gradient(to bottom,transparent 20%,#000 70%);mask-image:linear-gradient(to bottom,transparent 20%,#000 70%)}
/* Subir de nivel: fogonazo violeta y letras de golpe */
:root[data-theme="anime"] .overlay.center::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 40%,rgba(171,139,255,.9),rgba(122,59,255,.3) 40%,transparent 70%);opacity:0;animation:soulsFlash 1s ease-out both}
:root[data-theme="anime"] .lvlwin .k{font-size:24px;letter-spacing:3px;color:var(--vd-lit);text-shadow:2px 2px 0 #15161C;animation:an-slam .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes an-slam{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
.emb.th-anime .panel{fill:#F6F4EE;stroke:#15161C;stroke-width:4}
.emb.th-anime .seal{fill:var(--br)}
.emb.th-anime .num{font-family:var(--disp);font-size:26px;fill:#fff}

/* ================= Tema Gimnasio: hierro y tiza (goma negra, acero cepillado, dorado) ================= */
:root[data-theme="gym"]{
  --bg:#1A1A1A; --bg-2:#202020; --sur:#262626; --sur-2:#2E2E2E; --deep:#111111;
  --line:#3A3A3A; --line-2:#525252;
  --vd:#E4B424; --vd-lit:#F5CB4A; --vd-dim:#5C4A10; --vd-ghost:rgba(228,180,36,.12);
  --br:#B9BFC6; --br-lit:#DCE1E6; --br-dim:#4A4F55; --br-ghost:rgba(185,191,198,.12);
  --txt:#F3F3F0; --txt-2:#C8C8C2; --txt-3:#93938E; --txt-4:#67675F;
  --bad:#D9483B; --bad-dim:#4A211C; --bad-lit:#F07A6E;
  --on-vd:#1A1400; --shield:#2E2E2E; --out:#0E0E0E;
  --bronce:#B87333; --plata:#C7CBD6; --oro:#F2C230; --platino:#DDE7F2; --diamante:#6FD3F5; --leyenda:#A67CF5;
  --disp:'Bebas Neue','Oswald',Impact,sans-serif;
  --sans:'Barlow Condensed','Arial Narrow',sans-serif;
  --cut:none; --cut-lg:none;
  color-scheme:dark;
}
:root[data-theme="gym"] body{font-size:17px}
/* Cajas: losetas de goma de suelo (punteado fino) con el canto superior de acero cepillado, como el borde de un banco */
:root[data-theme="gym"] :is(.card,.pj,.tramos,.metric,.cta,.ach,.own,.chart,.tile,.set,.tpl,.bchip,.fb,.pick-b,.strip button,.slot,.toast){
  border-radius:5px;border:1px solid #3A3A3A;
  background:
    linear-gradient(90deg,#5C5C5C,#9A9A9A 30%,#6E6E6E 55%,#A2A2A2 80%,#5C5C5C) top/100% 3px no-repeat,
    radial-gradient(circle,rgba(255,255,255,.045) 1px,transparent 1.6px) 0 0/9px 9px,
    #262626;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.06),0 3px 0 #0E0E0E;
}
:root[data-theme="gym"] .slot{border-style:solid}
:root[data-theme="gym"] .slot.ok,:root[data-theme="gym"] .bchip.done,:root[data-theme="gym"] .pick-b.done{background:var(--vd);border-color:var(--vd);color:#1A1400}
:root[data-theme="gym"] .slot.try{background:#333}
:root[data-theme="gym"] .bchip.on,:root[data-theme="gym"] .pick-b.sel{border-color:var(--vd);box-shadow:inset 0 0 0 1px var(--vd),0 3px 0 #0E0E0E}
:root[data-theme="gym"] .btn{background:var(--vd);color:#1A1400;font-size:21px;letter-spacing:2px;border-radius:4px;box-shadow:0 4px 0 #8A6D12;text-transform:uppercase;padding:13px}
:root[data-theme="gym"] .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8A6D12}
:root[data-theme="gym"] .btn-2{border-radius:4px;border:2px solid var(--line-2);font-family:var(--disp);font-size:18px;letter-spacing:1.5px;text-transform:uppercase;padding:11px}

function estadoFuerza(r) { const h = r.ej.filter((e) => e[2] != null).length; if (!h) return null; return r.ej.every((e) => e[2] >= e[1]) ? 'ok' : 'try'; }

function estadoCorrer() { const k = S.correr.km; if (!k) return null; return k >= S.correr.objKm ? 'ok' : 'try'; }
function resumen() {
  const d = { ganada: 0, penal: 0, ok: 0, try: 0, bad: 0, objetivos: [], lineas: [] };
  const suma = (n, pts) => { d.ganada += pts; d.lineas.push([n, pts]); };
  const cuenta = (estados, obj, ptsOk, nombre) => {
    const ok = estados.filter((e) => e === 'ok').length, tr = estados.filter((e) => e === 'try').length;
    const vacios = Math.max(0, obj - ok - tr);
    d.ok += ok; d.try += tr; d.bad += vacios;
    if (ok) suma(`${nombre}, ${ok} completada${ok > 1 ? 's' : ''}`, ok * ptsOk);
    if (vacios) d.penal += vacios * Math.round(ptsOk / 2);
    if (ok >= obj) d.objetivos.push(nombre);
  };
  cuenta(S.calistenia.slots, S.calistenia.obj, XP.calistenia, 'Calistenia');
  cuenta([estadoCorrer()], 1, XP.correr, 'Correr');
  cuenta(S.fuerza.rutinas.map(estadoFuerza), S.fuerza.obj, XP.fuerza, 'Fuerza');
  cuenta(S.movilidad.rutinas.map(estadoMov), S.movilidad.obj, XP.movilidad, 'Movilidad');
  cuenta(S.desarrollo.slots.map((s) => s[2]), S.desarrollo.obj, XP.desarrollo, 'Desarrollo personal');
  const activos = S.pasos.dias.filter((x) => x[1]).length;
  if (activos) suma(`Pasos, ${activos} día${activos > 1 ? 's' : ''} activo${activos > 1 ? 's' : ''}`, activos * XP.pasosDia);
  const totalPasos = S.pasos.dias.reduce((a, x) => a + (x[0] || 0), 0);
  if (totalPasos >= S.pasos.objDia * 7) d.objetivos.push('Pasos');
  if (S.mision.ok) suma('Misión de la semana', S.mision.pts);
  d.bonus = d.objetivos.length * XP.objetivo; d.totalPasos = totalPasos; d.activos = activos;
  d.total = d.ganada + d.bonus - d.penal;
  return d;
}

function estadoDesde(nivel, acum) { let n = nivel, x = acum; while (x >= coste(n)) { x -= coste(n); n++; } while (x < 0 && n > 0) { n--; x += coste(n); } return [n, Math.max(0, x)]; }

// --- Gráficas: por defecto solo dos; el resto las añade el usuario desde un catálogo ---
const ULT = 8;
// Valores con coma decimal y separador de miles.
const fv = (n, dec = 0) => Number(n).toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
// Barras por semana (últimas ULT), con el número encima de cada barra y "sem. N" debajo; la última es la semana en curso.
function svgBarras(valores, unidad = '', dec = 0) {
  const W = 380, H = 168, px = 8, top = 22, base = H - 24;
  const vals = valores.slice(-ULT), semanas = vals.map((_, i) => S.semana - vals.length + 1 + i);
  const bw = (W - px * 2) / vals.length, max = Math.max(...vals, 1);
  const bars = vals.map((v, i) => { const h = Math.max(0, v) / max * (base - top), x = px + i * bw + 5, cx = x + (bw - 10) / 2, now = i === vals.length - 1; return `<rect class="b ${now ? 'now' : ''}" x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${(bw - 10).toFixed(1)}" height="${h.toFixed(1)}"/><text class="t ${now ? 'g' : ''}" x="${cx.toFixed(1)}" y="${(base - h - 5).toFixed(1)}" text-anchor="middle">${fv(v, dec)}${unidad ? ' ' + unidad : ''}</text><text class="t" x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle">sem. ${semanas[i]}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor de cada una de las últimas semanas">${bars}</svg>`;
}
// Escalera de nivel: un peldaño por semana, cada nivel rotulado a la izquierda, punto relleno en las semanas en que subió.
function svgNivel(nv) {
  const W = 380, H = 168, px = 8, top = 22, base = H - 24, pxN = 54;
  const semanas = nv.map((_, i) => S.semana - nv.length + 1 + i), nMin = Math.min(...nv), nMax = Math.max(...nv);
  const yN = (n) => base - (n - nMin + .5) / (nMax - nMin + 1) * (base - top), bwN = (W - pxN - px) / nv.length;
  const grid = Array.from({ length: nMax - nMin + 1 }, (_, k) => { const n = nMin + k, y = yN(n); return `<line class="grid" x1="${pxN}" x2="${W - px}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="t ${n === nv[nv.length - 1] ? 'g' : ''}" x="${pxN - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">nivel ${n}</text>`; }).join('');
  const escalera = nv.map((n, i) => { const x0 = pxN + i * bwN, x1 = x0 + bwN, y = yN(n); return `${i ? 'L' : 'M'}${x0.toFixed(1)} ${y.toFixed(1)} L${x1.toFixed(1)} ${y.toFixed(1)}`; }).join(' ');
  const puntos = nv.map((n, i) => `<circle class="pt ${n !== (nv[i - 1] ?? n) ? '' : 'soft'}" cx="${(pxN + i * bwN + bwN / 2).toFixed(1)}" cy="${yN(n).toFixed(1)}" r="3.5"/><text class="t" x="${(pxN + i * bwN + bwN / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">sem. ${semanas[i]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Nivel que tenías cada semana">${grid}<path class="ln" d="${escalera}"/>${puntos}</svg>`;
}
// Un punto por evaluación hecha (al empezar y cada una desde entonces) y el hueco de la siguiente si hay ritmo fijado.
function svgEval(valores, unidad = '') {
  const W = 380, H = 150, px = 8, top = 22;
  const semanasEval = valores.map((_, i) => i === 0 ? 0 : S.evalUltima - (valores.length - 1 - i) * (S.evalCada || 8));
  const prox = proximaEval(), cols = valores.length + (prox !== null ? 1 : 0), colW = (W - px * 2) / cols;
  const vMin = Math.min(...valores), vMax = Math.max(...valores), rango = Math.max(vMax - vMin, 1), dec = valores.some((v) => v % 1) ? 1 : 0;
  const pts = valores.map((v, i) => [px + colW * (i + .5), top + 8 + (vMax - v) / rango * (H - 24 - top - 16)]);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const ultimo = pts[pts.length - 1], xProx = px + colW * (valores.length + .5);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor en cada evaluación">
    <path class="ln br" d="${path}"/>
    ${pts.map((p, i) => `<circle class="pt br" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/><text class="t g br" x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" text-anchor="middle">${fv(valores[i], dec)}${unidad ? ' ' + unidad : ''}</text><text class="t" x="${p[0].toFixed(1)}" y="${H - 7}" text-anchor="middle">${i === 0 ? 'al empezar' : `sem. ${semanasEval[i]}`}</text>`).join('')}
    ${prox !== null ? `<line class="grid dash" x1="${ultimo[0].toFixed(1)}" y1="${ultimo[1].toFixed(1)}" x2="${xProx.toFixed(1)}" y2="${ultimo[1].toFixed(1)}"/><circle class="pt hollow" cx="${xProx.toFixed(1)}" cy="${ultimo[1].toFixed(1)}" r="4"/><text class="t" x="${xProx.toFixed(1)}" y="${H - 7}" text-anchor="middle">sem. ${prox}, próxima</text>` : ''}</svg>`;
}

function hojaCierre() {
  const r = resumen();
  const prog = [['Calistenia', `E${S.calistenia.esc} a E${S.calistenia.esc + 1}`], ['Correr', `${S.correr.objKm} a ${S.correr.objKm + 1} km`], ['Fuerza, empuje', 'E6 a E7'], ['Fuerza, tirón', 'E5 a E6'], ['Fuerza, pierna', 'E4 a E5'], ['Pasos', `${fmt(S.pasos.objDia)} a ${fmt(S.pasos.objDia + 1000)}`], ['Desarrollo personal', '30 a 40 min']];

    <div class="summary">

      <div><span>Logro: semanas cerradas, bronce</span><span class="plus num">+200</span></div>
      ${r.bad === 0 ? '<div><span>Logro: semana perfecta</span><span class="plus num">+400</span></div>' : ''}
      <div><span>Sin hacer (restan la mitad de lo que pagaban)</span><span class="minus num">−${r.penal}</span></div>
      <div class="tot"><span>Total</span><span class="num">${r.total + extra >= 0 ? '+' : ''}${fmt(r.total + extra)}</span></div>

function ejecutarCierre(r, subidas) {
  const logros = [['Semanas cerradas', 'bronce', 200]];
  if (r.bad === 0) logros.push(['Semana perfecta', 'bronce', 400]);
  const total = r.total + logros.reduce((a, l) => a + l[2], 0);
  const antes = S.nivel;
  let xp = S.xpBase + total, nivel = S.nivel;
  while (xp >= coste(nivel)) { xp -= coste(nivel); nivel++; }
  while (xp < 0 && nivel > 0) { nivel--; xp += coste(nivel); }
  if (xp < 0) xp = 0;
  // La animación repasa la semana entera desde donde empezó (nivel y barra del lunes), aunque el nivel ya haya subido en vivo.
  const estadoCon = (acum) => estadoDesde(S.nivel, acum);
  abrir(`<h2>Semana ${S.semana} cerrada</h2>${ORN}
    <div class="count"><span class="k">${uxp()} de la semana</span><span class="big num" id="cnt">0</span></div>
    <div class="ca" id="ca">
      <div id="ca-emb">${emblema(S.nivel)}</div>
      <p class="lv" id="ca-lv">Nivel ${S.nivel}</p><p class="tt" id="ca-tt">${titulo(S.nivel)}</p>
      <div class="xp"><i id="ca-bar" style="width:${(S.xpBase / coste(S.nivel) * 100).toFixed(1)}%"></i><span class="notch">${notches}</span></div>
      <div class="xp-txt"><span class="num" id="ca-xp">${fmt(S.xpBase)} de ${fmt(coste(S.nivel))}</span><span id="ca-next">siguiente: <b>${titulo(S.nivel + 1)}</b></span></div>
      <p class="msg" id="ca-msg"></p>
      ${subidas.length ? `<p class="hint" style="margin-top:8px;color:var(--br)">Escalón arriba: ${subidas.join(', ').toLowerCase()}</p>` : ''}
    </div>
    <div class="actions" style="grid-template-columns:1fr"><button class="btn" id="ok">Empezar la semana ${S.semana + 1}</button></div>`, false);
  // La cifra cuenta y la barra se llena a la vez; cada nivel que cruza suma tiempo para que se vea llenarse, vaciarse y empezar de nuevo.
  const el = $('cnt'), ca = $('ca'); let nivelVisto = S.nivel;
  const pinta = (acum) => {
    const [n, x] = estadoCon(acum);
    $('ca-bar').style.width = `${(x / coste(n) * 100).toFixed(1)}%`;
    $('ca-xp').textContent = `${fmt(Math.round(x))} de ${fmt(coste(n))}`;
    if (n !== nivelVisto) {
      nivelVisto = n;
      $('ca-lv').textContent = `Nivel ${n}`; $('ca-tt').textContent = titulo(n); $('ca-next').innerHTML = `siguiente: <b>${titulo(n + 1)}</b>`; $('ca-emb').innerHTML = emblema(n);
      ca.classList.remove('bump'); void ca.offsetWidth; ca.classList.add('bump');
    }
  };
  const fin = () => {
    const m = $('ca-msg');
    if (nivel > antes) m.textContent = nivel - antes > 1 ? `Subes ${nivel - antes} niveles: ${titulo(nivel)}` : `Subes de nivel: ${titulo(nivel)}`;
    else if (nivel < antes) { m.textContent = `Bajas al nivel ${nivel}: ${titulo(nivel)}`; m.classList.add('down'); }
    else { m.textContent = `Faltan ${fmt(coste(nivel) - xp)} para ${titulo(nivel + 1)}.`; m.classList.add('same'); }
    m.classList.add('on');
  };
  const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducido) { el.textContent = (total >= 0 ? '+' : '') + fmt(total); pinta(S.xpBase + total); fin(); }
  else {
    const t0 = performance.now(), dur = 1600 + 900 * Math.abs(nivel - antes);
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 2.2);
      el.textContent = (total >= 0 ? '+' : '') + fmt(Math.round(total * e)); pinta(S.xpBase + total * e);
      if (p < 1) requestAnimationFrame(tick); else fin();
    };
    requestAnimationFrame(tick);
  }
  setTimeout(() => logros.forEach((l, i) => setTimeout(() => trofeo(`${l[0]}, ${l[1]}`, `+${l[2]} de ${uxp()}`), i * 700)), 600);
  $('ok').onclick = () => {
    S.historia.push(total); S.niveles.push(antes);
    S.semana++; S.nivel = nivel; S.xpBase = xp;
    if (subidas.includes('Calistenia')) S.calistenia.esc++;
    if (subidas.includes('Correr')) S.correr.objKm++;
    if (subidas.includes('Pasos')) { S.pasos.esc++; S.pasos.objDia += 1000; }
    if (subidas.includes('Desarrollo personal')) S.desarrollo.esc++;
    S.fuerza.rutinas.forEach((rt) => { const sube = subidas.includes('Fuerza, ' + rt.n.toLowerCase()); if (sube) rt.esc++; rt.ej.forEach((e) => { e[2] = null; if (sube) e[1] = Math.round(e[1] * 1.1); }); });
    S.calistenia.slots = S.calistenia.slots.map(() => null); S.correr.km = null;
    S.movilidad.rutinas.forEach((rt) => rt.ch.forEach((c) => { c[1] = false; }));
    S.pasos.dias = S.pasos.dias.map(() => [null, false]);
    S.desarrollo.slots.forEach((s) => { s[2] = null; });
    S.mision = { texto: 'Haz una sesión de movilidad extra antes de dormir', tier: 'fácil', pts: 100, ok: false };
    cerrar(); guardar(); renderTodo(); ir('semana');
  };
}

function trasCambio(nivelAntes, xpAntes) {
  guardar(); refrescar(); mostrarDelta(xpAhora() - xpAntes);

  const ring = $('ring'); if (ring) { ring.classList.remove('bump'); void ring.offsetWidth; ring.classList.add('bump'); }

function accion(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, i = Number(el.dataset.i), antes = xpAhora(), nivelAntes = vivo()[0];
  if (act === 'cal') { const s = S.calistenia.slots; s[i] = s[i] === null ? 'ok' : s[i] === 'ok' ? 'try' : null; }
  else if (act === 'dp') { const s = S.desarrollo.slots[i]; s[2] = s[2] === null ? 'ok' : s[2] === 'ok' ? 'try' : null; }
  else if (act === 'mision') { S.mision.ok = !S.mision.ok; }
  else if (act === 'fuerza') return hojaFuerza(i);
  else if (act === 'mov') return hojaMov(i);
  else if (act === 'dia') return hojaDia(i);
  else if (act === 'cierre') return hojaCierre();
  else if (act === 'blk') { bloqueAbierto = el.dataset.b; try { localStorage.setItem('wq-bloque', bloqueAbierto); } catch {} return renderSemana(); }
  else if (act === 'pick') { const k = el.dataset.b; E.sel = E.sel.includes(k) ? E.sel.filter((x) => x !== k) : [...E.sel, k]; return renderEntrada(); }
  else if (act === 'e-go') { if (!E.sel.length) return; E.paso = 0; return renderEntrada(); }
  else if (act === 'e-close') return cerrarEntrada();
  else if (act === 'e-back') { E.paso--; return renderEntrada(); }
  else if (act === 'e-next') { if (E.paso >= E.sel.length - 1) return cerrarEntrada(); E.paso++; return renderEntrada(); }
  else if (act === 'tab-logros') { tabLogros = el.dataset.t; return renderLogros(); }
  else if (act === 'personal') { const v = S.personales[el.dataset.c][el.dataset.n]; v[1] = !v[1]; guardar(); renderLogros(); if (v[1]) trofeo(el.dataset.n, `+${v[0]} de ${uxp()}`); return; }
  else if (act === 'nuevo-personal') return hojaNuevoPersonal();
  else if (act === 'eval-elegir') return hojaEvalElegir();
  else if (act === 'eval') return hojaPronto('Hacer la evaluación');
  else if (act === 'niveles') return hojaNiveles();
  else if (act === 'plantillas') return hojaPlantillas();
  else if (act === 'tema') { aplicarTema(el.dataset.t); refrescar(); return renderMas(); }
  else if (act === 'soon') return hojaPronto(el.querySelector('.t').firstChild.textContent.trim());
  else if (act === 'reset') { S = estadoInicial(); guardar(); renderTodo(); ir('semana'); return; }
  else if (act === 'eval-cada') return hojaEvalCada();
  else if (act === 'add-g') return hojaGraficas();
  else if (act === 'quitar-g') { S.graficas = S.graficas.filter((k) => k !== el.dataset.g); guardar(); return renderStats(); }
  else return;
  trasCambio(nivelAntes, antes);
}
function cambio(e) {
  if (e.target.classList.contains('km')) { const antes = xpAhora(), nivelAntes = vivo()[0]; S.correr.km = e.target.value === '' ? null : Number(e.target.value); trasCambio(nivelAntes, antes); }
}
for (const raiz of [document.querySelector('main'), $('entry')]) { raiz.addEventListener('click', accion); raiz.addEventListener('change', cambio); }
renderTodo();
abrirEntrada();
</script>
